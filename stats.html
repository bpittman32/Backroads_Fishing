<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Snag &amp; Brag Stats</title>
<style>
:root{color-scheme:dark;
  --bg:#0f1512;--surface:#141a17;--card:#1a221e;--line:#2a3530;--grid:#24302a;
  --text:#eef2ee;--text2:#b9c4bc;--muted:#8a978e;
  --s1:#3987e5;--s2:#d95926;--accent:#f2a93b;--bad:#e66767;--good:#5fb86f;--r:12px;
  --p0:#3987e5;--p1:#e8803a;--p2:#5fb86f;--p3:#c46ad0;--p4:#e2c040;--p5:#2fb7b0;--p6:#e66767;--p7:#9aa4ff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#f3f5f2;--surface:#fcfcfb;--card:#ffffff;--line:#dfe5df;--grid:#e8ece8;
  --text:#0f1512;--text2:#45514a;--muted:#6a766e;--s1:#2a78d6;--s2:#eb6834;--accent:#b8720a;--bad:#c63c3b;--good:#2f8a43}}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f5f2;--surface:#fcfcfb;--card:#ffffff;--line:#dfe5df;--grid:#e8ece8;--text:#0f1512;--text2:#45514a;--muted:#6a766e;--s1:#2a78d6;--s2:#eb6834;--accent:#b8720a;--bad:#c63c3b;--good:#2f8a43}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 16px 40px;max-width:980px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
h1 small{font-size:12px;color:var(--muted);font-weight:500}
h2{font-size:15px;margin:22px 0 8px;color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
button{cursor:pointer}button:active{transform:translateY(1px)}
.chip{padding:5px 11px;border-radius:999px;font-size:13px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{border-radius:999px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#1b1205;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi i{font-style:normal;font-size:12px;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.card h3{margin:0 0 2px;font-size:14px}.card p.sub{margin:0 0 8px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font-size:10px}
.bars .bl{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .bl .nm{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{height:10px;background:var(--grid);border-radius:4px;position:relative;overflow:hidden}
.bars .tr div{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars .v{font-variant-numeric:tabular-nums;color:var(--text);min-width:48px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--grid)}
.tw{overflow-x:auto;max-height:70vh;overflow-y:auto}
.muted{color:var(--muted)}.err{color:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.cmp td.a,.cmp th.a{color:var(--text)}.cmp .dlt{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text2);margin:1px 2px 1px 0}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:12px;padding:6px 8px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:20;display:none;max-width:240px}
#login{max-width:420px;margin:40px auto}
#login input{width:100%;margin:8px 0}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
details summary{cursor:pointer}
.pill{font-size:11px;color:var(--muted)}
.legend{flex-wrap:wrap}
.prog{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;min-width:60px}.prog div{height:100%;background:var(--accent);border-radius:3px}
.cap{color:var(--accent);font-weight:600}
td .sm{display:block;font-size:11px;color:var(--muted)}
.ins{list-style:none;margin:4px 0 0;padding:0}.ins li{padding:8px 0 8px 12px;border-top:1px solid var(--line);border-left:3px solid var(--muted);margin-bottom:2px;font-size:14px}
.ins li:first-child{border-top:0}.ins li span{display:block;color:var(--text2);font-size:13px}.ins li.hi{border-left-color:var(--bad)}.ins li.mid{border-left-color:var(--accent)}.ins li.low{border-left-color:var(--s1)}
.feed{list-style:none;margin:0;padding:0;font-size:13px;max-height:420px;overflow-y:auto}.feed li{padding:5px 0;border-top:1px solid var(--line)}
.rb{display:inline-block;width:38px;height:6px;background:var(--grid);border-radius:3px;margin-right:6px;vertical-align:middle;overflow:hidden}.rb i{display:block;height:100%;background:var(--good)}
#who{padding:5px 10px;border-radius:999px;font-size:13px;max-width:180px}
h2 small{font-weight:400;font-size:12px}
.tw td:first-child{min-width:118px}
</style>
</head>

  const S=RAW.sessions.filter(s=>new Date(s.at)>=cut&&w(s.player_id)),E=RAW.errors.filter(e=>new Date(e.at)>=cut&&w(e.player_id)),V=RAW.ev.filter(e=>e.t>=cut&&w(e.p));
  return{S,E,V,P:RAW.P,cut};}
function nameOf(P,id){const p=P[id];return p&&p.player?p.player+(p.tag?' #'+p.tag:''):'Player '+String(id).slice(0,5);}

  const locs={};for(const s of S)for(const k in (s.locs||{}))locs[k]=(locs[k]||0)+(+s.locs[k]||0);
  const casts=S.reduce((a,s)=>a+(+s.casts||0),0),hooked=S.reduce((a,s)=>a+(+s.hooked||0),0),lost=S.reduce((a,s)=>a+(+s.lost||0),0),quests=S.reduce((a,s)=>a+(+s.quests||0),0);
  return{players:ids.size,sessions:S.length,min,fish,avg:S.length?min/S.length:0,fph:min?fish/(min/60):0,errors:E.length,eph:min?E.length/(min/60):0,locs,app:S.length?S.filter(s=>s.app).length/S.length:0,
    casts,hooked,lost,quests,hookR:casts?hooked/casts:null,landR:hooked?fish/hooked:null,lostR:hooked?lost/hooked:null};}
// Fishing outcomes from events, grouped by any key: landed, lost, missed and the rates between them.
function outcomes(V,keyFn){const g={};const get=k=>g[k]||(g[k]={k,landed:0,lost:0,missed:0,len:0,lenN:0,pctMax:0,fs:0,fsN:0,why:{},amt:0,sold:0,rel:0});
  for(const e of V){if(e.k!=='catch'&&e.k!=='lost'&&e.k!=='miss')continue;const k=keyFn(e);if(k==null||k==='')continue;const r=get(k);
    if(e.k==='catch'){r.landed++;r.amt+=+e.d.amt||0;if(e.d.out==='sold')r.sold++;else if(e.d.out==='released'||e.d.out==='tagged')r.rel++;
      if(e.d.len){r.len+=+e.d.len;r.lenN++;const sp=SPM[e.d.sp];if(sp&&sp.len)r.pctMax+=e.d.len/sp.len[1];}if(e.d.fs!=null){r.fs+=+e.d.fs;r.fsN++;}}

    else{r.missed++;const w=MISSN[e.d.why]||e.d.why||'?';r.why[w]=(r.why[w]||0)+1;}}

// Daily columns for one or two series. Same scale for both; one axis.
function dayChart(series,valueName,fmtV){const days=[];const end=new Date();end.setHours(0,0,0,0);for(let i=RANGE-1;i>=0;i--)days.push(dayKey(end.getTime()-i*DAY));
  const W=360,H=160,L=30,B=20,T=8,n=days.length,k=series.length,gw=(W-L)/n,bw=Math.max(2,Math.min(18,(gw-2)/k-1));

  let bars='';days.forEach((d,i)=>{series.forEach((s,j)=>{const v=vals[j][i];if(!v)return;const x=L+i*gw+(gw-k*(bw+1))/2+j*(bw+1),yy=y(v),h=H-B-yy;bars+=`<path d="M${x},${H-B}V${yy+Math.min(3,h)}q0,-3 3,-3h${bw-6}q3,0 3,3V${H-B}Z" fill="var(${s.c})"/>`;});});
  let lab='';const step=Math.ceil(n/6);days.forEach((d,i)=>{if(i%step)return;const dt=new Date(d+'T12:00');lab+=`<text x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle">${dt.toLocaleDateString([], {month:'short',day:'numeric'})}</text>`;});
  const svg=el('div');svg.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(valueName)} per day">${g}${bars}${lab}<line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/><rect class="hit" x="${L}" y="0" width="${W-L}" height="${H}" fill="transparent"/></svg>`;
  const s=svg.querySelector('svg');s.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.floor((x-L)/gw);if(i<0||i>=n){hideTip();return;}

// Lines for a value that carries over from day to day (a player's level): each line holds its last value until it

function lineChart(series,valueName,fmtV){const days=[];const end=new Date();end.setHours(0,0,0,0);for(let i=RANGE-1;i>=0;i--)days.push(dayKey(end.getTime()-i*DAY));

  const vals=series.map(s=>{let last=null;const first=Object.keys(s.by).sort()[0];return days.map(d=>{if(s.by[d]!=null)last=s.by[d];else if(s.start!=null&&first&&d<first)return null;return last;});});
  const all=vals.flat().filter(v=>v!=null);if(!all.length){const e=el('div',{class:'muted'},'Nothing yet.');return e;}
  let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<4){lo=Math.max(0,lo-2);hi=hi+2;}lo=Math.floor(lo);hi=Math.ceil(hi);

  let lab='';const st=Math.ceil(n/6);days.forEach((d,i)=>{if(i%st)return;lab+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${new Date(d+'T12:00').toLocaleDateString([], {month:'short',day:'numeric'})}</text>`;});
  const w=el('div');w.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(valueName)} by day">${g}${ln}${lab}<rect x="${L}" y="0" width="${W-L}" height="${H}" fill="transparent"/></svg>`;
  const sv=w.querySelector('svg');sv.addEventListener('pointermove',e=>{const r=sv.getBoundingClientRect(),i=Math.round(((e.clientX-r.left)/r.width*W-L)/gw);if(i<0||i>=n){hideTip();return;}

function legendOf(series){const lg=el('div',{class:'legend'});lg.innerHTML=series.map(s=>`<span style="--c:var(${s.c})">${esc(s.name)}</span>`).join('');return lg;}
// Level by day for one player, from their sessions (the level they started a session at counts for that day too).

function countBy(arr,key,val){const o={};for(const x of arr){const k=typeof key==='function'?key(x):x[key];if(k==null||k==='')continue;o[k]=(o[k]||0)+(val?val(x):1);}return o;}

function vparts(v){const m=/(\d+)\.(\d+)([a-z]*)/.exec(v||'');return m?[+m[1],+m[2],m[3]]:[0,0,''];}
function vcmp(a,b){const x=vparts(a),y=vparts(b);return x[0]-y[0]||x[1]-y[1]||(x[2]<y[2]?-1:x[2]>y[2]?1:0);}
let ERRV=store.get('bs-errv')||'open',ERRLATEST=store.get('bs-errlatest')==='1';
async function setFix(msg,ver,undo){
  if(DEMO){RAW.fixes=(RAW.fixes||[]).filter(f=>f.msg!==msg);if(!undo)RAW.fixes.push({msg,fixed_version:ver,fixed_at:new Date().toISOString()});render();return;}
  try{const r=await fetch(SB_URL+'/rest/v1/rpc/error_fix',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:store.get('bs-key'),p_msg:msg,p_version:ver,p_undo:!!undo})});
    if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m);}load();}
  catch(e){alert('Couldn’t save that: '+(/error_fix/.test(String(e.message))?'run the error-fixes SQL in Supabase first.':e.message));}}
function viewErrors(m,{S,E,P}){
  const latest=[...new Set([...S,...E].map(x=>x.version).filter(Boolean))].sort(vcmp).pop()||'';
  const FIX={};for(const f of (RAW.fixes||[]))FIX[f.msg]=f;
  const groups={};for(const e of E){const k=(e.msg||'(no message)').slice(0,160);const g=groups[k]||(groups[k]={msg:k,n:0,players:new Set(),versions:{},devices:{},srcs:{},last:e.at,first:e.at,ev:[]});g.n++;g.ev.push(e);g.players.add(e.player_id);g.versions[e.version]=(g.versions[e.version]||0)+1;g.devices[e.device]=(g.devices[e.device]||0)+1;if(e.src)g.srcs[e.src]=(g.srcs[e.src]||0)+1;if(e.at>g.last)g.last=e.at;if(e.at<g.first)g.first=e.at;}

  m.append(kpis([[fmt(OE.length),'Open errors'],[fmt(open.length),'Different errors'],[fmt(new Set(OE.map(e=>e.player_id)).size),'Players affected'],[fmt(s.eph,2),'Per hour played']]));
  const bv=card('Errors per hour by version','Fewer is better. All errors, fixed or not. Versions with under 10 minutes of play are left out.');const byV={};for(const x of S)byV[x.version]=(byV[x.version]||0)+(+x.minutes||0);const ev=countBy(E,'version');
  bv.append(barList(Object.keys(byV).filter(v=>byV[v]>=10).sort(vcmp).reverse().slice(0,8).map(v=>({name:v,v:(ev[v]||0)/(byV[v]/60)})),v=>fmt(v,2)));m.append(bv);
  const c=card('What broke','Grouped by message. Mark one fixed once a fix is out; it hides until it shows up again on a newer version.');
  const bar=el('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px'});
  for(const [k,n] of [['open',`Open (${open.length})`],['fixed',`Fixed (${fixed.length})`],['all','All']]){const b=el('button',{class:'chip'+(ERRV===k?' on':'')},n);b.onclick=()=>{ERRV=k;store.set('bs-errv',k);render();};bar.append(b);}
  const lb=el('button',{class:'chip'+(ERRLATEST?' on':'')},`Only ${latest||'latest'}`);lb.onclick=()=>{ERRLATEST=!ERRLATEST;store.set('bs-errlatest',ERRLATEST?'1':'0');render();};bar.append(lb);c.append(bar);

    const badge=g.status==='back'?' <span class="tag" style="background:var(--bad);color:#fff">Came back</span>':g.status==='fixed'?' <span class="tag">Fixed in '+esc(g.fix.fixed_version||'?')+'</span>':'';
    d.innerHTML=`<summary><b class="${g.n>2&&g.status!=='fixed'?'err':''}">${g.n}×</b> ${esc(g.msg)}${badge} <span class="muted">· ${g.players.size} player${g.players.size>1?'s':''} · last ${ago(g.last)}</span></summary>

    const btn=el('button',{class:'chip',style:'margin:8px 0 0 14px'},g.status==='fixed'?'Undo fixed':g.status==='back'?'Mark fixed again':'Mark fixed');

// Sortable table. cols: [key, label, {n:numeric, f:format(value,row), w:min width}]; rows are objects.
function table(cols,rows,opt={}){const wrap=el('div',{class:'tw'});let sk=opt.sort||cols[1][0],dir=opt.dir||-1;

  const draw=()=>{const rs=rows.slice().sort((a,b)=>{const x=val(a,sk),y=val(b,sk);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(typeof x==='string'?x.localeCompare(y):x-y)*dir;});
    const t=el('table');t.innerHTML=`<thead><tr>${cols.map(([k,l,o={}])=>`<th class="${o.n?'n':''}" data-k="${k}">${esc(l)}${k===sk?(dir<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead>`;
    const tb=el('tbody');for(const r of rs.slice(0,opt.limit||500)){const tr=el('tr',{class:opt.click?'click':''});tr.innerHTML=cols.map(([k,l,o={}])=>`<td class="${o.n?'n':''}">${o.f?o.f(r[k],r):esc(r[k]==null?'–':r[k])}</td>`).join('');if(opt.click)tr.onclick=()=>opt.click(r);tb.append(tr);}
    t.append(tb);t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sk)dir=-dir;else{sk=k;dir=-1;}draw();});wrap.innerHTML='';wrap.append(t);
    if(!rs.length)wrap.append(el('div',{class:'muted',style:'padding:8px'},opt.empty||'Nothing yet.'));};
  draw();return wrap;}
const P0=v=>v==null?'–':pct(v),F1=v=>v==null?'–':fmt(v,1),F0=v=>v==null?'–':fmt(v);
// a small two-part bar: landed vs lost, for reading a rate at a glance in a table
const rateBar=(v)=>v==null?'–':`<span class="rb"><i style="width:${Math.round(v*100)}%"></i></span>${pct(v)}`;

// ---------- Overview ----------
function viewOverview(m,{S,E,V,P,cut}){const s=summarize(S,E),active=new Set(S.map(x=>x.player_id)).size;
  m.append(kpis([[fmt(active),'Played',WHO?'':`of ${RAW.players.length} anglers`],[hrs(s.min),'Time fishing',`${fmt(s.sessions)} sessions, ${hrs(s.avg)} each`],[fmt(s.fish),'Fish landed',`${fmt(s.fph,1)} an hour`],
    [pct(s.landR),'Hooked fish landed',`${pct(s.hookR)} of casts get hooked`],[fmt(s.quests),'Quests done',s.min?`${fmt(s.quests/(s.min/60),1)} an hour`:''],[fmt(s.errors),'Errors',`${fmt(s.eph,2)} an hour`]]));
  const ins=insights({S,E,V,P,cut}),c=card('Worth a look','What stands out in this range, most pressing first.');
  if(!ins.length)c.append(el('div',{class:'muted'},'Nothing stands out.'));else{const ul=el('ul',{class:'ins'});for(const i of ins)ul.append(el('li',{class:i.lvl},`<b>${esc(i.title)}</b><span>${esc(i.why)}</span>`));c.append(ul);}
  m.append(c);
  const hBy={},pBy={},fBy={},lBy={};for(const x of S){const d=dayKey(x.at);hBy[d]=(hBy[d]||0)+(+x.minutes||0)/60;fBy[d]=(fBy[d]||0)+(+x.fish||0);lBy[d]=(lBy[d]||0)+(+x.lost||0);(pBy[d]=pBy[d]||new Set()).add(x.player_id);}
  const pc={};for(const d in pBy)pc[d]=pBy[d].size;
  const g=el('div',{class:'grid2'});const c1=card('Hours fished per day');c1.append(dayChart([{by:hBy,c:'--s1',name:'Hours'}],'hours',v=>fmt(v,v&&v<10?1:0)));g.append(c1);
  const c2=card('Anglers per day');c2.append(dayChart([{by:pc,c:'--s2',name:'Anglers'}],'anglers',v=>fmt(v)));g.append(c2);
  const c3=card('Where the time goes','Hours at each place.');c3.append(barList(toRows(s.locs,12,plName),hrs));g.append(c3);
  const c4=card('Fish landed and lost per day');const ser=[{by:fBy,c:'--s1',name:'Landed'},{by:lBy,c:'--s2',name:'Lost'}];c4.append(legendOf(ser));c4.append(dayChart(ser,'fish',v=>fmt(v)));g.append(c4);m.append(g);
  if(!V.length)m.append(el('p',{class:'muted',style:'font-size:13px'},evSpan()));}

function lastBalance(V){const b={};for(const e of V)if(e.d.c!=null&&!e.d.tour&&(!b[e.p]||e.t>=b[e.p].t))b[e.p]={c:+e.d.c,t:e.t};return b;}
function insights({S,E,V,P,cut}){const out=[],add=(lvl,title,why)=>out.push({lvl,title,why}),now=Date.now(),mine=p=>!WHO||p.player_id===WHO;
  for(const p of RAW.players.filter(mine)){const d=(now-new Date(p.last_seen))/DAY;if(d>=3&&d<45)add(d>=7?'hi':'mid',`${nameOf(P,p.player_id)} hasn’t played in ${fmt(Math.floor(d))} days`,`Last seen ${when(p.last_seen)}, level ${p.level}, at ${plName((RAW.sessions.find(s=>s.player_id===p.player_id)||{}).quit_loc)}.`);}
  const latest=[...new Set(RAW.sessions.map(x=>x.version).filter(Boolean))].sort(vcmp).pop();
  for(const p of RAW.players.filter(mine))if(p.version&&latest&&vcmp(p.version,latest)<0&&(now-new Date(p.last_seen))/DAY<7)add('mid',`${nameOf(P,p.player_id)} is still on ${p.version}`,`Latest is ${latest}. The game updates after it has been closed for 15 minutes.`);
  // stalled: played a lot in range without a level
  const per={};for(const x of S){const r=per[x.player_id]||(per[x.player_id]={min:0,lo:99,hi:0});r.min+=+x.minutes||0;r.lo=Math.min(r.lo,+x.lv_start||+x.level||0);r.hi=Math.max(r.hi,+x.level||0);}
  for(const [id,r] of Object.entries(per)){const lv=(P[id]||{}).level;if(r.min>=180&&r.hi===r.lo&&lv&&lv<31)add('low',`${nameOf(P,id)} hasn’t levelled in ${hrs(r.min)} of play`,`Stuck at level ${r.hi}.`);}
  if(V.length){const sp=outcomes(V.filter(e=>!e.d.tour),e=>e.d.sp);
    for(const r of Object.values(sp)){if(r.hooked>=10&&r.landR<.6)add('mid',`${spName(r.k)} gets away ${pct(1-r.landR)} of the time`,`${r.lost} lost of ${r.hooked} hooked. Most often: ${r.topWhy?r.topWhy[0]:'–'}.`);
      else if(r.bites>=15&&r.setR<.45)add('low',`Only ${pct(r.setR)} of ${spName(r.k)} bites get hooked`,`${r.missed} missed of ${r.bites} bites. Most often: ${r.topWhy?r.topWhy[0]:'–'}.`);}
    const ms=V.filter(e=>e.k==='miss'&&e.d.fit!=null),small=ms.filter(e=>e.d.fit<0);if(ms.length>=15&&small.length/ms.length>.35)add('low',`${pct(small.length/ms.length)} of missed strikes were on a hook too small for the fish`,'Players may not know to size up the hook.');
    const byLoc=outcomes(V,e=>e.d.loc),min={};for(const x of S)for(const k in(x.locs||{}))min[k]=(min[k]||0)+(+x.locs[k]||0);
    const rates=Object.keys(min).filter(k=>min[k]>=30&&byLoc[k]).map(k=>({k,r:byLoc[k].landed/(min[k]/60)}));if(rates.length>=3){const med=rates.map(x=>x.r).sort((a,b)=>a-b)[Math.floor(rates.length/2)];for(const x of rates)if(x.r<med*.5)add('low',`${plName(x.k)} is slow: ${fmt(x.r,1)} fish an hour`,`The middle place does ${fmt(med,1)} an hour.`);}
    {const rich=Object.entries(lastBalance(V)).filter(([id,b])=>b.c>=25000).sort((a,b)=>b[1].c-a[1].c);if(rich.length)add('low',rich.length>1?`${rich.length} anglers are sitting on 25,000+ coins`:`${nameOf(P,rich[0][0])} is sitting on ${fmt(rich[0][1].c)} coins`,(rich.length>1?rich.map(([id,b])=>`${shortName(P,id)} ${fmt(b.c)}`).join(', ')+'. ':'')+'Plenty saved and little left they want to buy.');}
    const cs=V.filter(e=>e.k==='catch'&&!e.d.tour),so=cs.filter(e=>e.d.out==='sold').length,re=cs.filter(e=>e.d.out==='released'||e.d.out==='tagged').length;
    if(so+re>=30&&re/(so+re)<.15)add('low',`Only ${pct(re/(so+re))} of fish are released`,'Releasing pays half but adds luck and respect; nearly everyone sells.');
    const never=META.sp.filter(s=>!s[8]&&!s[5]).map(s=>s[0]).filter(id=>!cs.some(e=>e.d.sp===id));const reach=never.filter(id=>SPM[id].locs.some(l=>min[l]>=60));
    if(reach.length&&RANGE>=30)add('low',`${reach.length} species weren’t caught where people fished`,reach.slice(0,6).map(spName).join(', ')+(reach.length>6?'…':'')+'.');}
  const cur=(RAW.tourneys||[]).find(t=>new Date(t.starts)<=now&&new Date(t.ends)>now);
  if(cur){const ent=new Set((RAW.entries||[]).filter(e=>e.tid===cur.id).map(e=>e.player_id)),miss=RAW.players.filter(p=>mine(p)&&p.level>=31&&!ent.has(p.player_id));
    if(miss.length)add('low',`${miss.length} level-31 angler${miss.length>1?'s haven’t':' hasn’t'} entered ${cur.name}`,miss.map(p=>p.player).join(', ')+'.');}
  const FIX={};for(const f of(RAW.fixes||[]))FIX[f.msg]=f;const recent=E.filter(e=>!FIX[(e.msg||'').slice(0,160)]&&now-new Date(e.at)<7*DAY);
  if(recent.length)add(recent.length>=5?'hi':'mid',`${recent.length} unfixed error report${recent.length>1?'s':''} this week`,'See Health.');
  const ord={hi:0,mid:1,low:2};return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);}

// ---------- Players ----------
function viewPlayers(m,D){const {S,V,P}=D;if(WHO){playerDetail(m,WHO,D);return;}
  const per={};for(const p of RAW.players)per[p.player_id]={id:p.player_id,name:nameOf(P,p.player_id),lv:p.level,resp:p.respect,wins:p.wins||0,seen:new Date(p.last_seen).getTime(),ver:p.version,min:0,fish:0,hooked:0,days:new Set(),coins:null,sp:p.species};
  for(const s of S){const r=per[s.player_id];if(!r)continue;r.min+=+s.minutes||0;r.fish+=+s.fish||0;r.hooked+=+s.hooked||0;r.days.add(dayKey(s.at));}
  const bal=lastBalance(RAW.ev);for(const r of Object.values(per)){r.nd=r.days.size;r.land=r.hooked?r.fish/r.hooked:null;r.fph=r.min?r.fish/(r.min/60):null;r.coins=bal[r.id]?bal[r.id].c:null;}
  const c=card('Anglers','Activity in the chosen range. Tap a row for the full picture.');
  c.append(table([['name','Angler'],['lv','Level',{n:1}],['seen','Last seen',{n:1,f:v=>ago(v)}],['nd','Days',{n:1}],['min','Time',{n:1,f:v=>v?hrs(v):'–'}],['fish','Fish',{n:1,f:F0}],['fph','Per hour',{n:1,f:F1}],['land','Landed',{n:1,f:P0}],
    ['coins','Coins',{n:1,f:F0}],['resp','Respect',{n:1,f:F0}],['sp','Species',{n:1}],['wins','Wins',{n:1,f:v=>v?'🏆'+v:'–'}],['ver','Version']],Object.values(per),{sort:'seen',click:r=>{WHO=r.id;store.set('bs-who',WHO);render();}}));m.append(c);
  // level race
  const ser=Object.values(per).filter(r=>r.min>0).sort((a,b)=>b.lv-a.lv).slice(0,8).map((r,i)=>({name:shortName(P,r.id),c:`--p${i}`,by:levelBy(S.filter(s=>s.player_id===r.id)),start:1}));
  if(ser.length){const c2=card('Levels over time','Each angler’s level by day.');c2.append(legendOf(ser));c2.append(lineChart(ser,'level',v=>fmt(v)));m.append(c2);}}

function feedLine(e,P){const d=e.d,pl=plName(d.loc),t=new Date(e.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});let s;
  if(e.k==='catch')s=`Landed a ${fmt(d.len,1)} cm ${spName(d.sp)} on ${luName(d.lu)} · ${OUTN[d.out]||d.out}${d.amt?` +${fmt(d.amt)}`:''}${d.pb?' · personal best':''}`;
  else if(e.k==='lost')s=`Lost a ${fmt(d.len,1)} cm ${spName(d.sp)}: ${d.why}`;else if(e.k==='miss')s=`Missed a ${spName(d.sp)}: ${MISSN[d.why]||d.why}`;
  else if(e.k==='bait')s=`Sabiki: ${d.n} ${spName(d.sp)}`;else if(e.k==='buy')s=`Bought ${itemName(d.item)} for ${fmt(d.amt)}`;else if(e.k==='earn')s=`${d.src==='quest'?'Quest: '+(d.q||''):d.src==='prize'?'Tournament prize, '+(d.rank?'#'+d.rank:''):d.src} +${fmt(d.amt)}`;
  else if(e.k==='fee')s=`Paid ${fmt(d.amt)} for ${plName(d.place)}`;else if(e.k==='unlock')s=`Unlocked ${plName(d.place)} for ${fmt(d.amt)}`;else if(e.k==='level')s=`Reached level ${d.to}`;
  else if(e.k==='tcatch')s=`Tournament: ${fmt(d.len,1)} cm ${spName(d.sp)}${d.hit?'':' (not the target)'}`;else if(e.k==='tour')s=d.act==='enter'?'Entered the tournament':`Left the tournament after ${fmt(d.min,0)} min`;else s=e.k;
  return`<li><span class="muted">${esc(t)}</span> ${esc(s)}${e.k!=='buy'&&e.k!=='level'&&d.loc?` <span class="muted">· ${esc(pl)}</span>`:''}</li>`;}
function playerDetail(m,id,{S,E,V,P}){const p=P[id]||{},mine=S,ev=V,s=summarize(mine,E),bal=lastBalance(RAW.ev)[id];
  const back=el('button',{class:'chip'},'‹ All anglers');back.onclick=()=>{WHO='';store.set('bs-who',null);render();};m.append(back);
  m.append(el('h2',{},esc(nameOf(P,id))+` <small class="muted">level ${p.level||'–'} · ${esc(p.device||'')} · ${esc(p.version||'')} · joined ${p.first_seen?new Date(p.first_seen).toLocaleDateString():''}</small>`));

    [bal?fmt(bal.c):'–','Coins now',bal?ago(bal.t):''],[fmt(p.respect),'Respect',''],[`${fmt(p.species)}/${META.sp.filter(x=>!x[8]).length}`,'Species found',''],[p.wins?'🏆 '+p.wins:'0','Tournament wins','']]));
  const g=el('div',{class:'grid2'});
  const c1=card('Level by day');c1.append(lineChart([{name:'Level',c:'--s1',by:levelBy(mine),start:1}],'level',v=>fmt(v)));g.append(c1);
  const mBy={};for(const x of mine){const d=dayKey(x.at);mBy[d]=(mBy[d]||0)+(+x.minutes||0);}const c2=card('Minutes per day');c2.append(dayChart([{by:mBy,c:'--s2',name:'Minutes'}],'min',v=>fmt(v)));g.append(c2);
  const c3=card('Where they fish');c3.append(barList(toRows(s.locs,10,plName),hrs));g.append(c3);
  if(ev.length){const cs=ev.filter(e=>e.k==='catch');const c4=card('What they land');c4.append(barList(toRows(countBy(cs,e=>e.d.sp),10,spName),v=>fmt(v)));g.append(c4);
    const c5=card('Favourite baits','Fish landed on each.');c5.append(barList(toRows(countBy(cs,e=>e.d.lu),8,luName),v=>fmt(v)));g.append(c5);
    const lo=ev.filter(e=>e.k==='lost'),mi=ev.filter(e=>e.k==='miss');const c6=card('How fish get away',`${lo.length} lost in the fight, ${mi.length} missed strikes.`);c6.append(barList(toRows(Object.assign(countBy(lo,e=>e.d.why),countBy(mi,e=>MISSN[e.d.why]||e.d.why)),8),v=>fmt(v)));g.append(c6);}
  m.append(g);
  if(ev.length){const bu=ev.filter(e=>e.k==='buy');if(bu.length){const c7=card('Purchases',`${fmt(bu.reduce((a,e)=>a+(+e.d.amt||0),0))} coins on ${bu.length} things.`);c7.append(table([['when','When',{f:v=>esc(new Date(v).toLocaleDateString())}],['item','Item',{f:v=>esc(itemName(v))}],['amt','Coins',{n:1,f:F0}],['lv','Level',{n:1}]],bu.map(e=>({when:e.t,item:e.d.item,amt:+e.d.amt,lv:e.d.lv})),{sort:'when'}));m.append(c7);}
    const c8=card('Recent activity');const ul=el('ul',{class:'feed'});ul.innerHTML=ev.slice(-60).reverse().map(e=>feedLine(e,P)).join('');c8.append(ul);m.append(c8);}
  else m.append(el('p',{class:'muted',style:'font-size:13px'},evSpan()));}

// ---------- Balance ----------
function viewBalance(m,{S,V}){V=V.filter(e=>!e.d.tour);if(!V.some(e=>e.k==='catch'||e.k==='lost'||e.k==='miss')){noEvents(m,'Game balance');return;}
  const locs=[...new Set(V.map(e=>e.d.loc).filter(Boolean))].sort((a,b)=>PLACE_ORDER.indexOf(a)-PLACE_ORDER.indexOf(b));if(BPLACE&&!locs.includes(BPLACE))BPLACE='';

  const W=BPLACE?V.filter(e=>e.d.loc===BPLACE):V,all=outcomes(W,()=>'all').all||{bites:0};

  m.append(kpis([[fmt(all.bites),'Bites',min?`${fmt(all.bites/(min/60),1)} an hour`:''],[P0(all.setR),'Bites hooked',`${fmt(all.missed)} missed`],[P0(all.landR),'Hooked fish landed',`${fmt(all.lost)} lost`],[F1(all.avgFs)+' s','Average fight',''],[P0(all.avgPct),'Average size','of the species’ top size']]));

  const g=el('div',{class:'grid2'});
  const lo=W.filter(e=>e.k==='lost'),c1=card('Why hooked fish get away',`${lo.length} lost.`);c1.append(barList(toRows(countBy(lo,e=>e.d.why),10),v=>fmt(v)));g.append(c1);
  const mi=W.filter(e=>e.k==='miss'),fit=countBy(mi.filter(e=>e.d.fit!=null),e=>e.d.fit<0?'Hook too small':e.d.fit>0?'Hook too big':'Hook the right size');
  const c2=card('Why strikes miss',`${mi.length} missed. Hook size below counts misses on plain bait hooks and lures.`);c2.append(barList(toRows(countBy(mi,e=>MISSN[e.d.why]||e.d.why),6),v=>fmt(v)));c2.append(el('div',{style:'height:8px'}));c2.append(barList(toRows(fit,3),v=>fmt(v)));g.append(c2);m.append(g);
  const lu=Object.values(outcomes(W,e=>e.d.lu)).map(r=>{const top=countBy(W.filter(e=>e.k==='catch'&&e.d.lu===r.k),e=>e.d.sp),t=Object.entries(top).sort((a,b)=>b[1]-a[1])[0];return Object.assign(r,{name:luName(r.k),top:t?spName(t[0]):'–',spN:Object.keys(top).length});});
  const c3=card('Baits and lures','How each one fishes. “Kinds” is how many species it has caught.');
  c3.append(table([['name','Bait or lure'],['bites','Bites',{n:1}],['setR','Hooked',{n:1,f:rateBar}],['landR','Landed',{n:1,f:rateBar}],['landed','Fish',{n:1}],['spN','Kinds',{n:1}],['top','Catches most']],lu,{sort:'bites'}));m.append(c3);
  const rods=Object.values(outcomes(W,e=>e.d.rod+(e.d.rl?':'+e.d.rl:''))).map(r=>{const [id,l]=r.k.split(':');const sn=W.filter(e=>e.k==='lost'&&e.d.why==='Line snapped'&&(e.d.rod+(e.d.rl?':'+e.d.rl:''))===r.k).length;return Object.assign(r,{name:rodName(id)+(l?` +${l}`:''),snap:r.hooked?sn/r.hooked:null});});
  const c4=card('Rods','“Snapped” is the share of hooked fish that broke the line.');c4.append(table([['name','Rod'],['hooked','Hooked',{n:1}],['landR','Landed',{n:1,f:rateBar}],['snap','Snapped',{n:1,f:P0}],['avgFs','Fight s',{n:1,f:F0}],['avgPct','Size',{n:1,f:P0}]],rods,{sort:'hooked'}));m.append(c4);
  const cond=[];const add=(label,fn)=>{for(const r of Object.values(outcomes(W,fn)))cond.push(Object.assign(r,{name:label(r.k)}));};
  add(k=>PERN[k]||k,e=>e.d.per);add(k=>WXN[k]||k,e=>e.d.wx);add(k=>SSN[k]||k,e=>e.d.ssn);
  const c5=card('Time, weather and season','Bites an hour would need minutes per condition, which isn’t tracked; compare the rates instead.');c5.append(table([['name','When'],['bites','Bites',{n:1}],['setR','Hooked',{n:1,f:rateBar}],['landR','Landed',{n:1,f:rateBar}],['avgPct','Size',{n:1,f:P0}]],cond,{sort:'bites'}));m.append(c5);
  const caught=new Set(W.filter(e=>e.k==='catch').map(e=>e.d.sp)),miss=META.sp.filter(s=>!s[8]&&(!BPLACE||s[2].includes(BPLACE))&&!caught.has(s[0]));
  if(miss.length){const c6=card('Not caught',`Species${BPLACE?' here':''} nobody landed in this range. Legends are rare by design.`);c6.append(el('div',{},miss.map(s=>`<span class="tag">${esc(s[1])}${s[5]?' ★':''}${BPLACE?'':` <span class="muted">${esc(s[2].map(plName).join(', '))}</span>`}</span>`).join('')));m.append(c6);}
  const ba=W.filter(e=>e.k==='bait');if(ba.length){const c7=card('Sabiki bait','Herring and mackerel swung aboard.');c7.append(barList(toRows(countBy(ba,e=>e.d.sp,e=>+e.d.n||0),4,spName),v=>fmt(v)));m.append(c7);}}

// ---------- Economy ----------
function viewEconomy(m,{V,P}){V=V.filter(e=>!e.d.tour);const money=V.filter(e=>(e.k==='catch'&&e.d.amt)||e.k==='earn'||e.k==='buy'||e.k==='fee'||e.k==='unlock');
  if(!money.length){noEvents(m,'The economy view');return;}
  const inc=e=>e.k==='catch'||e.k==='earn',src=e=>e.k==='catch'?(e.d.out==='sold'?'Selling fish':'Releasing fish'):e.d.src==='quest'?'Quests':e.d.src==='prize'?'Tournament prizes':'Other',
    cat=e=>e.k==='buy'?itemCat(e.d.item):e.k==='fee'?'Trip fees':'Unlocking places';
  const earned=money.filter(inc).reduce((a,e)=>a+(+e.d.amt||0),0),spent=money.filter(e=>!inc(e)).reduce((a,e)=>a+(+e.d.amt||0),0),bal=lastBalance(V),bals=Object.values(bal).map(b=>b.c).sort((a,b)=>a-b);

// ---------- Tournaments ----------
function tRank(tid){return(RAW.entries||[]).filter(e=>e.tid===tid).sort((a,b)=>(b.len_cm??-1)-(a.len_cm??-1)||(b.lb??-1)-(a.lb??-1)).map((e,i,a)=>Object.assign({},e,{rank:e.len_cm==null?null:a.findIndex(x=>x.len_cm===e.len_cm&&x.lb===e.lb)+1}));}
